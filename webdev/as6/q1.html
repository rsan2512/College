<html>
    <body>
        <h2 id="ch">Hello World</h2>
        <button id="btn">Change Text</button>
        <script>
            const helper=document.getElementById('ch');
            const btn=document.getElementById('btn');
            btn.addEventListener('click',()=>{helper.innerHTML="Welcome to DOM Manipulation";});
        </script>
    </body>
</html>
