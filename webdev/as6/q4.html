<html>
    <body>
        <input type="number" id="count" value="0">
        <button onclick="change(+1)">+</button>
        <button onclick="change(-1)">-</button>
        <script>
            function change(num){
                let cnt=parseInt(document.getElementById('count').value);
                cnt=cnt+num;
                if(cnt<0) alert("Num cannot be below 0");
                else{
                    document.getElementById("count").value=cnt;
                }
            }
        </script>
    </body>
</html>
