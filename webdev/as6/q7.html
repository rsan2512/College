<html>
<head>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; max-width: 450px; }
    h2 { margin-bottom: 20px; }
    form { display: flex; flex-direction: column; gap: 6px; }
    label { font-weight: bold; margin-top: 10px; }
    input[type="text"], input[type="password"], select, textarea {
      padding: 8px; font-size: 0.95rem; border: 1px solid #ccc;
      border-radius: 4px; width: 100%; box-sizing: border-box;
    }
    textarea { resize: vertical; height: 80px; }
    .radio-group { display: flex; gap: 16px; }
    button {
      margin-top: 16px; padding: 10px; background: black;
      color: white; border: none; border-radius: 4px;
      font-size: 1rem; cursor: pointer;
    }
    button:hover { background: #333; }
  </style>
</head>
<body>
  <h2>Registration Form</h2>
  <form id="regForm">
    <label>Name:</label>
    <input type="text" id="name" placeholder="Enter your name" />

    <label>Gender:</label>
    <div class="radio-group">
      <input type="radio" name="gender" value="Male" /> Male
      <input type="radio" name="gender" value="Female" /> Female
      <input type="radio" name="gender" value="Other" /> Other
    </div>

    <label>Mobile:</label>
    <input type="text" id="mobile" placeholder="Enter 10-digit mobile number" />

    <label>Address:</label>
    <textarea id="address" placeholder="Enter your address"></textarea>

    <label>Country:</label>
    <select id="country">
      <option value="">-- Select Country --</option>
      <option>India</option>
      <option>USA</option>
      <option>UK</option>
      <option>Australia</option>
      <option>Canada</option>
    </select>

    <label>Email:</label>
    <input type="text" id="email" placeholder="Enter your email" />

    <label>Password:</label>
    <input type="password" id="password" placeholder="6–15 characters" />

    <button type="submit">Register</button>

  </form>

  <script src="q7.js"></script>
</body>
</html>
